name: Simulator Smoke

on:
  workflow_dispatch:
    inputs:
      messages:
        description: "Synthetic message count"
        required: true
        default: "10000"
      scenario:
        description: "Simulation scenario"
        required: true
        default: "burst"
        type: choice
        options:
          - burst
          - sustained
          - duplicates
          - retry-storm

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m simulator --scenario ${{ inputs.scenario }} --messages ${{ inputs.messages }} --rate 1000
