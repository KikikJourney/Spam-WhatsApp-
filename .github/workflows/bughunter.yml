name: Bug Hunter CI

on:
  push:
    paths:
      - "hunter/**"
      - "tests/**"
      - ".github/workflows/bughunter.yml"
  pull_request:
    paths:
      - "hunter/**"
      - "tests/**"
      - ".github/workflows/bughunter.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject real messaging transport
        run: |
          if grep -RniE 'api\.whatsapp|web\.whatsapp|wa\.me|twilio|selenium|playwright|whatsapp-web' hunter tests; then
            echo "Forbidden real-messaging integration detected."
            exit 1
          fi
          grep -Rni 'REAL_PHONE_TRANSPORT = False' simulator/fixture.py
          grep -Rni 'NETWORK_TRANSPORT = False' simulator/fixture.py
          if grep -RniE 'requests\.(post|put)|urllib\.request\.(urlopen|Request)' hunter | grep -Ei 'whatsapp|message|send'; then
            echo "Forbidden messaging transport pattern detected."
            exit 1
          fi
