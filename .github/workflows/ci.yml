name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Safety guard
        run: |
          ! grep -RniE 'api\.whatsapp|web\.whatsapp|wa\.me|twilio|selenium|playwright|whatsapp-web' simulator tests || true
          grep -Rni 'REAL_PHONE_TRANSPORT=false' README.md
      - name: Smoke test
        run: python -m simulator --scenario retry-storm --messages 1000 --failure-rate 0.05
