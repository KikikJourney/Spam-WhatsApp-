name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Safety guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'api\.whatsapp|web\.whatsapp|wa\.me|twilio|selenium|playwright|whatsapp-web' simulator tests; then
            echo "Forbidden messaging/browser transport dependency found in simulator source."
            exit 1
          fi
          grep -Rni 'REAL_PHONE_TRANSPORT=false' simulator
          grep -Rni 'NETWORK_TRANSPORT=false' simulator
      - name: Smoke test
        run: python -m simulator --scenario retry-storm --messages 1000 --failure-rate 0.05
